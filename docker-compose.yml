services:
  postgres:
    image: postgres:16-alpine
    container_name: registro-postgres
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-registro_campo}
      POSTGRES_USER: ${POSTGRES_USER:-registro}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-registro_local_seguro}
    ports:
      - "5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10

  minio:
    image: minio/minio:latest
    container_name: registro-minio
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-minioadmin}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-minioadmin123}
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - minio_data:/data

volumes:
  postgres_data:
  minio_data:
